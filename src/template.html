<title>TUIOS Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a workbench — controls on the left, a live cell-accurate TUIOS screen pinned on the right; stacks on phones. */
:root {
  --bg: #eceff3; --panel: #ffffff; --ink: #151a22; --ink-2: #505a6a; --line: #d3d8e0;
  --chip: #e2e6ed; --accent: #2b4bd1; --accent-ink: #ffffff; --ok: #17794a; --warn: #a15c00;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1014; --panel: #161920; --ink: #e5e8ee; --ink-2: #98a1b0; --line: #2a2f39;
  --chip: #20242d; --accent: #8da1ff; --accent-ink: #0e1014; --ok: #5ccf8b; --warn: #f0b35a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1014; --panel: #161920; --ink: #e5e8ee; --ink-2: #98a1b0; --line: #2a2f39;
  --chip: #20242d; --accent: #8da1ff; --accent-ink: #0e1014; --ok: #5ccf8b; --warn: #f0b35a; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1600px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px }
header.top h1 { font: 600 22px/1.1 var(--f-display); letter-spacing: .01em; margin: 0; text-wrap: balance }
header.top h1 span { color: var(--ink-2); font-weight: 500 }
header.top p { margin: 0; color: var(--ink-2); font-size: 13px }
.wip { font: 600 11px var(--f-mono); font-style: normal; letter-spacing: .06em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; vertical-align: middle }
.changed-pill { margin-left: auto; font: 500 12px var(--f-mono); padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--ink-2) }
.changed-pill b { color: var(--accent) }

.steps { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; scrollbar-width: thin }
.steps button { flex: none; font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; gap: 7px; align-items: center }
.steps button i { font: 600 11px var(--f-mono); font-style: normal; color: var(--ink-2); opacity: .7 }
.steps button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.steps button[aria-current="step"] i { color: var(--bg) }
.steps button .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent) }

.bench { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr) } .stage { order: -1; position: static !important } }

.controls { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 20px; min-width: 0 }
.controls h2 { font: 600 18px/1.2 var(--f-display); margin: 0 0 4px }
.controls .lede { color: var(--ink-2); margin: 0 0 14px; font-size: 13px }
.group-h { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line) }
.group-h:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px }
.group-h small { text-transform: none; letter-spacing: 0; font: 400 11px var(--f-body); margin-left: 6px }
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; padding: 8px 0 }
.row .lab { display: flex; align-items: center; gap: 8px; font-weight: 500 }
.row .lab code { font: 400 11px var(--f-mono); color: var(--ink-2); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.row .desc { color: var(--ink-2); font-size: 12px; line-height: 1.4 }
.row.mod .lab::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none }
.reset { border: 0; background: none; color: var(--accent); font: 500 11px var(--f-body); cursor: pointer; padding: 0 }
.seg { display: flex; flex-wrap: wrap; gap: 4px }
.seg button { font: 500 12px var(--f-mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 4px 9px; border-radius: 5px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.seg button .smp { opacity: .8; margin-right: 5px }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2) }
.sw input { appearance: none; width: 34px; height: 20px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s }
.sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-2); transition: transform .15s }
.sw input:checked { background: var(--accent); border-color: var(--accent) }
.sw input:checked::after { transform: translateX(14px); background: var(--accent-ink) }
.rng { display: flex; align-items: center; gap: 10px }
.rng input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0 }
.rng output { font: 500 12px var(--f-mono); min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums }
input[type=text], input[type=search], select, textarea { font: 13px var(--f-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0 }
textarea { min-height: 110px; resize: vertical }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.sugg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px }
.sugg button { font: 11px var(--f-mono); border: 1px dashed var(--line); background: none; color: var(--ink-2); padding: 2px 7px; border-radius: 4px; cursor: pointer }

.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.themes button { border: 1px solid var(--line); border-radius: 7px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; background: var(--panel); color: var(--ink) }
.themes button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px }
.themes .tprev { padding: 8px 8px 6px; font: 11px/1.35 var(--f-mono) }
.themes .tbar { display: flex; height: 6px; margin-top: 6px; border-radius: 2px; overflow: hidden }
.themes .tbar span { flex: 1 }
.themes .tname { font: 500 12px var(--f-body); padding: 5px 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 4px }
.themes .tname small { color: var(--ink-2); font-size: 10px }

.lister { display: grid; gap: 4px }
.lister .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg) }
.lister .item.off { opacity: .55 }
.lister .item .nm { font: 500 12px var(--f-mono); display: flex; gap: 8px; align-items: center; min-width: 0 }
.lister .ctl { display: flex; gap: 4px; align-items: center }
.lister .ctl button { font: 11px var(--f-mono); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 2px 7px; cursor: pointer }
.lister .ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.lister .ctl input { width: 52px; padding: 2px 5px; font-size: 11px }

.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.presets button { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px; cursor: pointer; font: 13px var(--f-body) }
.presets button b { display: block; font: 600 14px var(--f-display) }
.presets button kbd { font: 11px var(--f-mono); background: var(--chip); border-radius: 3px; padding: 1px 5px }
.presets button small { display: block; color: var(--ink-2); font-size: 11.5px; margin-top: 4px; line-height: 1.35 }
.presets button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 12.5px; margin-top: 4px }
.keys kbd { font: 11.5px var(--f-mono); white-space: nowrap; color: var(--accent) }

.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; display: grid; gap: 8px }
.screen-bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 12px var(--f-mono); color: var(--ink-2) }
.screen-bar .seg button { padding: 2px 8px; font-size: 11px }
.screen-bar .sp { margin-left: auto }
.screen { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0,0,0,.35) }
.grid { font-family: var(--f-mono); white-space: pre; font-size: 10px; line-height: 1.2; font-variant-ligatures: none; user-select: none }
.grid .r { height: 1.2em; overflow: hidden }
.grid .cap { display: inline-block; width: 1ch; height: 1.2em; vertical-align: top }
.grid .cap i { display: block; height: 100% }
.grid .cap.l i { border-radius: 99em 0 0 99em; margin-left: .15ch }
.grid .cap.r i { border-radius: 0 99em 99em 0; margin-right: .15ch }
.note { font-size: 12px; color: var(--ink-2); margin: 0 }

.out-tabs { display: flex; gap: 4px; margin: 6px 0 8px; flex-wrap: wrap }
.out-tabs button { font: 500 12px var(--f-body); border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); padding: 5px 10px; border-radius: 5px; cursor: pointer }
.out-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
pre.code { font: 12px/1.5 var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 460px; margin: 0; white-space: pre }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center }
.btn { font: 600 13px var(--f-body); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 6px; cursor: pointer }
.btn.ghost { background: none; color: var(--accent) }
.toast { font-size: 12px; color: var(--ok) }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line) }
.all-filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px }
.all-filter button { font: 11px var(--f-mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); padding: 2px 8px; border-radius: 99px; cursor: pointer }
.all-filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-top: 10px }
.check input { margin-top: 3px; accent-color: var(--accent) }
details summary { cursor: pointer; font-weight: 500; margin-top: 14px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header class="top">
    <h1>TUIOS Workbench <span>for tuios 0.11</span> <em class="wip">WIP</em></h1>
    <p>Click settings together, watch the screen change, take the config to Claude.</p>
    <span class="changed-pill" id="changedPill"></span>
  </header>
  <nav class="steps" id="steps" aria-label="Wizard steps"></nav>
  <div class="bench">
    <section class="controls" id="controls" aria-live="polite"></section>
    <aside class="stage">
      <div class="screen-bar">
        <span>panes</span>
        <div class="seg" id="paneSeg"></div>
        <span>mode</span>
        <div class="seg" id="modeSeg"></div>
        <span class="sp" id="dims"></span>
      </div>
      <div class="screen" id="screen"><div class="grid" id="grid"></div></div>
      <p class="note">This is a mock-up of the real screen. Borders, layout, dock, rail and colors follow your settings. TUIOS's own Nerd Font icons appear here as plain symbols.</p>
    </aside>
  </div>
</div>

<script id="opts" type="application/json">__OPTS__</script>
<script id="themes" type="application/json">__THEMES__</script>
<script>
(() => {
// ---------- schema ----------
const RAW = JSON.parse(document.getElementById('opts').textContent);
const SCHEMA = {};
for (const [path, type, def, accepted, min, max, desc] of RAW) {
  let d = def;
  if (type === 'bool') d = def === 'true';
  else if (type === 'int') d = Number(def);
  SCHEMA[path] = { path, type, def: d, accepted, min, max, desc };
}
// Not scalar options (tables and lists), documented in KEYBINDINGS.md and CONFIGURATION.md
const DOCK_ITEMS = ['mode','workspaces','trail','tape','windows','transfers','notifications','copy-help','cpu','ram','clock','session-controls'];
const EXTRA = {
  'keybindings.preset': { type: 'string', def: 'tuios', accepted: ['tuios','tmux','screen','zellij'], desc: 'Keys of another multiplexer after the leader' },
  'keybindings.leader_key': { type: 'string', def: '', desc: 'The leader key. Empty uses the preset\'s leader' },
  'keybindings.leader_twice': { type: 'string', def: 'send', accepted: ['send','last_workspace'], desc: 'What the leader pressed two times does' },
  'dock.left': { type: 'list', def: ['mode','workspaces','trail','tape'] },
  'dock.center': { type: 'list', def: ['windows'] },
  'dock.right': { type: 'list', def: ['transfers','notifications','copy-help','cpu','ram','clock','session-controls'] },
};
for (const k in EXTRA) SCHEMA[k] = { path: k, ...EXTRA[k] };
SCHEMA['appearance.sidebar.width'].min = 16; SCHEMA['appearance.sidebar.width'].max = 48;
SCHEMA['appearance.zoom_max_width'].min = 0; SCHEMA['appearance.zoom_max_width'].max = 300;

const THEMES = {};
for (const t of JSON.parse(document.getElementById('themes').textContent)) {
  const k = ['id','name','dark','bg','fg','selection_bg','black','red','green','yellow','blue','purple','cyan','white','bright_black','bright_red','bright_green','bright_yellow','bright_blue','bright_purple','bright_cyan','bright_white'];
  const o = {}; k.forEach((n, i) => o[n] = t[i]); o.name = o.name || o.id.replace(/_/g, ' '); THEMES[o.id] = o;
}
const TERMINAL = { id: '', name: 'Terminal colors', dark: true, bg: '#16181d', fg: '#d6d9df', selection_bg: '#33373f',
  black: '#1e2127', red: '#e06c75', green: '#98c379', yellow: '#e5c07b', blue: '#61afef', purple: '#c678dd', cyan: '#56b6c2', white: '#abb2bf',
  bright_black: '#5c6370', bright_red: '#ef7a83', bright_green: '#a9d18a', bright_yellow: '#f0cc8c', bright_blue: '#72bcff', bright_purple: '#d788ee', bright_cyan: '#67c5d3', bright_white: '#ffffff' };
const THEME_ORDER = ['catppuccin_mocha','tokyonight','dracula','gruvbox_dark','nord','rose_pine','kanagawa','one_dark','catppuccin_latte','rose_pine_dawn','ayu_light'].filter(k => THEMES[k]);

// ---------- state ----------
const LS = 'tuios-workbench-v1';
let S = {}, P = { panes: 3, mode: 'window' }, step = 'look';
try { const j = JSON.parse(localStorage.getItem(LS) || '{}'); S = j.S || {}; P = { ...P, ...(j.P || {}) }; step = j.step || step; } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify({ S, P, step })); } catch (e) {} };
const get = p => (p in S ? S[p] : SCHEMA[p].def);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const set = (p, v) => { if (same(v, SCHEMA[p].def)) delete S[p]; else S[p] = v; save(); refresh(); };
const changed = () => Object.keys(S).filter(k => SCHEMA[k]);

// ---------- colors ----------
const hx = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const ANSI = ['black','red','green','yellow','blue','purple','cyan','white','bright_black','bright_red','bright_green','bright_yellow','bright_blue','bright_purple','bright_cyan','bright_white'];
function theme() { const t = get('appearance.theme'); return THEMES[t] || TERMINAL; }
function roles(T) {
  return { accent: T.bright_blue, accent_bright: T.bright_cyan, success: T.bright_green, warning: T.yellow, error: T.red, info: T.blue,
    muted: T.dark ? mix(T.bright_black, T.bg, .15) : mix(T.bright_black, T.bg, .3),
    surface: T.dark ? mix(T.bg, '#ffffff', .07) : mix(T.bg, '#000000', .06),
    panel: T.dark ? mix(T.bg, '#ffffff', .035) : mix(T.bg, '#000000', .03) };
}
function color(str, T, R) {
  if (str == null) return null; str = String(str).trim().toLowerCase(); if (!str) return null;
  if (/^#?[0-9a-f]{6}$/.test(str) || /^#[0-9a-f]{3}$/.test(str)) return str[0] === '#' ? str : '#' + str;
  const slot = str.replace('magenta', 'purple');
  if (T[slot] && ANSI.includes(slot)) return T[slot];
  if (slot === 'fg' || slot === 'bg') return T[slot];
  if (R[str]) return R[str];
  if (/^\d+$/.test(str) && +str < 16) return T[ANSI[+str]];
  return null;
}

// ---------- the cell grid ----------
const W = 112, H = 34;
let G = [];
function initGrid(bg, fg) { G = []; for (let y = 0; y < H; y++) { const r = []; for (let x = 0; x < W; x++) r.push({ c: ' ', fg, bg, b: 0, u: 0, cap: '', under: bg }); G.push(r); } }
function inClip(x, y, c) { return !c || (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h); }
function put(x, y, ch, fg, bg, o, clip) {
  if (x < 0 || y < 0 || x >= W || y >= H || !inClip(x, y, clip)) return;
  const c = G[y][x]; const prev = c.bg;
  c.c = ch; if (fg) c.fg = fg; if (bg) c.bg = bg;
  c.b = o && o.b ? 1 : 0; c.u = o && o.u ? 1 : 0; c.cap = (o && o.cap) || ''; c.under = c.cap ? prev : c.bg;
}
function text(x, y, s, fg, bg, o, clip) { const a = [...s]; a.forEach((ch, i) => put(x + i, y, ch, fg, bg, o, clip)); return a.length; }
function fill(x, y, w, h, bg, clip) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, ' ', null, bg, null, clip); }
function pill(x, y, s, fg, bg, caps, o, clip) {
  if (caps) { put(x, y, ' ', null, bg, { cap: 'l' }, clip); const n = text(x + 1, y, s, fg, bg, o, clip); put(x + 1 + n, y, ' ', null, bg, { cap: 'r' }, clip); return n + 2; }
  return text(x, y, ' ' + s + ' ', fg, bg, o, clip);
}
const plen = s => [...s].length + 2;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function gridHTML() {
  let out = '';
  for (const row of G) {
    out += '<div class="r">';
    let run = '', key = null, st = '';
    const flush = () => { if (run) out += `<span style="${st}">${esc(run)}</span>`; run = ''; };
    for (const c of row) {
      if (c.cap) { flush(); key = null; out += `<span class="cap ${c.cap}" style="background:${c.under}"><i style="background:${c.bg}"></i></span>`; continue; }
      const k = c.fg + c.bg + c.b + c.u;
      if (k !== key) { flush(); key = k; st = `color:${c.fg};background:${c.bg}${c.b ? ';font-weight:700' : ''}${c.u ? ';text-decoration:underline' : ''}`; }
      run += c.c;
    }
    flush(); out += '</div>';
  }
  return out;
}

// ---------- layout engine ----------
function split(r, dir, ratio, g) {
  if (dir === 'v') { const w1 = Math.round((r.w - g) * ratio); return [{ x: r.x, y: r.y, w: w1, h: r.h }, { x: r.x + w1 + g, y: r.y, w: r.w - w1 - g, h: r.h }]; }
  const h1 = Math.round((r.h - g) * ratio); return [{ x: r.x, y: r.y, w: r.w, h: h1 }, { x: r.x, y: r.y + h1 + g, w: r.w, h: r.h - h1 - g }];
}
function splitEven(r, k, dir, g) {
  const out = []; let rest = r;
  for (let i = k; i > 1; i--) { const [a, b] = split(rest, dir, 1 / i, g); out.push(a); rest = b; }
  out.push(rest); return out;
}
const area = r => r.w * r.h;
function bsp(A, n, g) {
  const scheme = get('appearance.tiling_scheme'); let rects = [A];
  for (let i = 1; i < n; i++) {
    let idx = rects.length - 1, dir;
    if (scheme === 'spiral') dir = i % 2 ? 'v' : 'h';
    else if (scheme === 'alternate') { idx = rects.reduce((m, r, j) => area(r) > area(rects[m]) ? j : m, 0); dir = i % 2 ? 'v' : 'h'; }

    control('appearance.prefix_repeat_time', { label: 'Leader stays armed after a repeat (ms)' }) ] },
  { id: 'behave', n: 'Behavior', title: 'Behavior and agents', lede: 'Mouse, motion, agents and the screen saver. Few of these show in the preview.', build: () => [
    head('Mouse and focus'),
    control('appearance.focus_follows_mouse', { label: 'Focus follows mouse' }), control('appearance.click_to_type', { label: 'Click into a pane to type' }),
    control('appearance.copy_on_select', { label: 'Copy on select' }), control('appearance.scroll_lines', { label: 'Lines per wheel notch' }),
    control('appearance.new_window_inherit_cwd', { label: 'New window keeps the folder' }),
    head('Motion'),
    control('appearance.motion', { label: 'Motion' }), control('appearance.animation_speed', { label: 'Animation speed', unit: '%' }),
    head('Agents'),
    control('agents.enabled', { label: 'Agent features', desc: 'Agents, the Inbox, mail and approvals. Off keeps only the multiplexer.' }),
    control('daemon.resume_agents', { label: 'Resume agents after a restart' }),
    control('notifications.bell', { label: 'Terminal bell' }),
    head('Screen saver'),
    control('screensaver.enabled', { label: 'Screen saver' }), control('screensaver.effect', { label: 'Effect' }), control('screensaver.idle_minutes', { label: 'Idle minutes' }),
    head('Safety'),
    control('appearance.confirm_quit', { label: 'Always confirm quit' }), control('appearance.scrollback_lines', { label: 'Scrollback lines' }) ] },
  { id: 'all', n: 'All settings', title: 'Every setting', lede: 'All ' + RAW.length + ' scalar options from tuios list-options, with the descriptions TUIOS ships.', build: allSettings },

let allQuery = '', allSection = 'changed';
function allSettings() {
  const secs = [...new Set(RAW.map(r => r[0].split('.')[0]))];
  const input = h('input', { type: 'search', id: 'all-q', placeholder: 'Search 250 settings', value: allQuery, on: { input: e => { allQuery = e.target.value; paint(); } } });
  const filters = h('div', { class: 'all-filter' }, ['changed', 'all', ...secs].map(s => h('button', { type: 'button', 'aria-pressed': String(allSection === s), on: { click: () => { allSection = s; refresh(); } } }, s === 'changed' ? 'changed (' + changed().length + ')' : s)));
  const list = h('div', {});
  const paint = () => {
    const q = allQuery.toLowerCase();
    const rows = RAW.map(r => r[0]).filter(p => (allSection === 'all' || (allSection === 'changed' ? p in S : p.startsWith(allSection + '.'))) && (!q || p.includes(q) || (SCHEMA[p].desc || '').toLowerCase().includes(q)));
    list.replaceChildren(...(rows.length ? rows.slice(0, 80).map(p => control(p, { label: p.split('.').slice(1).join('.') || p })) : [h('p', { class: 'desc' }, allSection === 'changed' ? 'Nothing changed yet. Pick "all" or a section to browse.' : 'No setting matches.')]));

// ---------- export ----------
function tomlVal(v) { if (Array.isArray(v)) return '[' + v.map(x => JSON.stringify(x)).join(', ') + ']'; if (typeof v === 'string') return JSON.stringify(v); return String(v); }
function toToml() {
  const keys = changed(); if (!keys.length) return '# No changes yet: every setting is at its default.\n';
  const dockTouched = keys.some(k => /^dock\.(left|center|right)$/.test(k));
  const tables = {};
  const add = (k, v) => { const i = k.lastIndexOf('.'); const t = k.slice(0, i), n = k.slice(i + 1); (tables[t] = tables[t] || []).push([n, v]); };
  for (const k of keys) if (!/^dock\.(left|center|right)$/.test(k)) add(k, get(k));
  if (dockTouched) for (const r of ['left', 'center', 'right']) add('dock.' + r, get('dock.' + r));
  const order = Object.keys(tables).sort((a, b) => { const rank = t => ['appearance', 'appearance.sidebar', 'appearance.scrollbar', 'appearance.selection', 'dock', 'dock.clock', 'startup', 'workspaces', 'keybindings'].indexOf(t); const ra = rank(a), rb = rank(b); return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb) || a.localeCompare(b); });
  let out = '# TUIOS config made with TUIOS Workbench (tuios 0.11)\n# Only keys that differ from the defaults.\n';
  for (const t of order) { out += `\n[${t}]\n`; for (const [n, v] of tables[t]) out += `${n} = ${tomlVal(v)}\n`; }
  return out;
}
const shq = v => { const s = String(v); return /^[\w.:+#@%/-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'"; };
function toCommands() {
  const keys = changed().filter(k => !EXTRA[k]);
  const tbl = changed().filter(k => EXTRA[k]);
  let out = '# Try the scalar settings live in a running TUIOS session:\n';
  out += keys.length ? keys.map(k => `tuios set-config ${k} ${shq(get(k))}`).join('\n') + '\n' : '# (no scalar settings changed)\n';
  if (get('keybindings.preset') !== 'tuios') out += `\n# Keybind preset (writes config.toml):\ntuios keybinds preset ${get('keybindings.preset')}\n`;
  if (tbl.some(k => k.startsWith('dock.') || k === 'keybindings.leader_key' || k === 'keybindings.leader_twice')) out += '\n# The dock lists and leader settings are tables: put them in config.toml\n# (see the config.toml tab), then run:\ntuios config apply\n';
  return out;
}
let withShim = false;
function toPrompt() {
  const toml = toToml();
  let p = `Configure TUIOS for me (tuios 0.11.1 on macOS).

1. Find my config file with \`tuios config path\` (on macOS usually ~/Library/Application Support/tuios/config.toml). If it exists, read it first and merge: keep the keys I already have, and let the values below win where they overlap. If it does not exist, create it.
2. Write these settings into it:

\`\`\`toml
${toml.trim()}
\`\`\`

3. Run \`tuios config apply\` so the running daemon picks it up, then \`tuios keybinds doctor\` to check for key conflicts.
4. Tell me which keys were applied, and quote any key or value tuios rejected with its error.`;
  if (withShim) p += `

5. Also make \`claude\` start under the TUIOS tmux shim inside TUIOS panes, so agent-team teammates open as TUIOS panes. Check ~/.zshrc first; if a \`claude()\` function that calls \`tuios tmux-shim\` is already there, leave it alone. Otherwise append:

\`\`\`sh
claude() {
  if [[ -n "$TUIOS_PANE_ID" && -z "$TMUX" ]]; then
    tuios tmux-shim -- claude "$@"
  else
    command claude "$@"
  fi
}
\`\`\``;
  return p;
}
let outTab = 'prompt';
function exportStep() {
  const pre = h('pre', { class: 'code', id: 'outPre', tabindex: '0' });
  const toast = h('span', { class: 'toast', role: 'status' });
  const content = () => outTab === 'toml' ? toToml() : outTab === 'cmd' ? toCommands() : toPrompt();
  const paint = () => { pre.textContent = content(); };
  const tabs = h('div', { class: 'out-tabs', role: 'group' }, [['prompt', 'Prompt for Claude'], ['toml', 'config.toml'], ['cmd', 'Live commands']].map(([k, l]) => h('button', { type: 'button', 'aria-pressed': String(outTab === k), on: { click: () => { outTab = k; refresh(); } } }, l)));
  const copy = h('button', { class: 'btn', type: 'button', on: { click: async () => {
    try { await navigator.clipboard.writeText(content()); toast.textContent = 'Copied. Paste it into Claude Code.'; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast.textContent = 'Copy is blocked here. The text is selected: press ⌘C.'; } } } }, 'Copy');
  const reset = h('button', { class: 'btn ghost', type: 'button', on: { click: () => { if (reset.dataset.arm) { S = {}; save(); refresh(); } else { reset.dataset.arm = '1'; reset.textContent = 'Click again to reset all'; } } } }, 'Reset everything');
  const shim = h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'withShim', ...(withShim ? { checked: '' } : {}), on: { change: e => { withShim = e.target.checked; paint(); } } }),
    h('span', {}, 'Also set up the tmux shim for Claude agent teams. ', h('span', { class: 'desc' }, 'Adds a claude() wrapper to ~/.zshrc so teammates open as TUIOS panes.')));
  const imp = h('textarea', { id: 'importBox', placeholder: '[appearance]\ntheme = "dracula"\nborder_style = "thick"' });
  const impMsg = h('span', { class: 'toast', role: 'status' });
  const importer = h('details', {}, h('summary', {}, 'Start from an existing config.toml'),
    h('p', { class: 'desc' }, 'Paste your current file (tuios config edit shows it). Known keys load into the workbench; tables it does not cover are skipped.'), imp,
    h('div', { class: 'actions' }, h('button', { class: 'btn ghost', type: 'button', on: { click: () => { const n = importToml(imp.value); impMsg.textContent = n + ' settings loaded.'; } } }, 'Load'), impMsg));
  paint();
  const summary = changed().length ? h('p', { class: 'desc' }, changed().length + ' settings differ from the defaults.') : h('p', { class: 'desc' }, 'Nothing changed yet. Go back through the steps, or the output stays empty.');
  return [summary, tabs, pre, h('div', { class: 'actions' }, copy, reset, toast), outTab === 'prompt' ? shim : null,
    h('p', { class: 'desc', style: 'margin-top:12px' }, outTab === 'cmd' ? 'set-config changes the running daemon. Put the config.toml in place to keep the changes.' : 'Paste the prompt into Claude Code. It merges into your config instead of overwriting it.'), importer];
}
function importToml(src) {
  let table = '', n = 0;
  for (let line of src.split('\n')) {
    line = line.replace(/\s+#.*$/, '').trim(); if (!line || line.startsWith('#')) continue;
    const t = line.match(/^\[([^\]]+)\]$/); if (t) { table = t[1].trim(); continue; }
    const kv = line.match(/^([\w.-]+)\s*=\s*(.+)$/); if (!kv) continue;
    const path = (table ? table + '.' : '') + kv[1]; const s = SCHEMA[path]; if (!s) continue;
    let raw = kv[2].trim(), v;
    try { v = raw.startsWith('[') ? JSON.parse(raw.replace(/'/g, '"')) : raw === 'true' ? true : raw === 'false' ? false : /^-?\d+$/.test(raw) ? +raw : JSON.parse(raw.startsWith("'") ? '"' + raw.slice(1, -1).replace(/"/g, '\\"') + '"' : raw); } catch (e) { continue; }
    if (same(v, s.def)) delete S[path]; else S[path] = v; n++;
  }
  save(); refresh(); return n;
}

// ---------- shell ----------
function updatePill() { const n = changed().length; document.getElementById('changedPill').innerHTML = n ? `<b>${n}</b> changed` : 'all defaults'; }
function refresh() {
  const st = STEPS.find(s => s.id === step) || STEPS[0];
  const nav = document.getElementById('steps');
  const touched = id => { const map = { look: /theme|border_(focused|unfocused|gradient)|glyphs/, windows: /border_style|gap|shared|window_|dim_|zen|scrollbar/, layout: /startup|tiling|master|scroll_column|zoom/, dock: /^dock|dock_|show_cpu|show_ram/, rail: /sidebar|session_colors/, keys: /keybindings|whichkey|prefix_repeat|frame_panels/, behave: /focus_follows|click_to|copy_on|motion|animation|agents|daemon|notifications|screensaver|confirm/ }[id]; return map && changed().some(k => map.test(k)); };
  nav.replaceChildren(...STEPS.map((s, i) => h('button', { type: 'button', 'aria-current': s.id === step ? 'step' : false, on: { click: () => { step = s.id; save(); refresh(); window.scrollTo({ top: 0 }); } } }, h('i', {}, String(i + 1)), s.n, touched(s.id) ? h('span', { class: 'dot', 'aria-label': 'changed' }) : null)));
  const box = document.getElementById('controls');
  const focusId = document.activeElement && document.activeElement.id; const sel = focusId && document.activeElement.selectionStart;
  const idx = STEPS.indexOf(st);
  box.replaceChildren(h('h2', {}, st.title), h('p', { class: 'lede' }, st.lede), ...st.build(),
    h('div', { class: 'nav' }, idx ? h('button', { class: 'btn ghost', type: 'button', on: { click: () => { step = STEPS[idx - 1].id; save(); refresh(); } } }, '← ' + STEPS[idx - 1].n) : h('span'),
      idx < STEPS.length - 1 ? h('button', { class: 'btn', type: 'button', on: { click: () => { step = STEPS[idx + 1].id; save(); refresh(); } } }, STEPS[idx + 1].n + ' →') : h('span')));
  if (focusId) { const e = document.getElementById(focusId); if (e) { e.focus(); try { if (sel != null) e.setSelectionRange(sel, sel); } catch (x) {} } }
  document.getElementById('paneSeg').replaceChildren(...[1, 2, 3, 4, 5, 6].map(n => h('button', { type: 'button', 'aria-pressed': String(P.panes === n), on: { click: () => { P.panes = n; save(); refresh(); } } }, String(n))));
  document.getElementById('modeSeg').replaceChildren(...['window', 'terminal'].map(m => h('button', { type: 'button', 'aria-pressed': String(P.mode === m), on: { click: () => { P.mode = m; save(); refresh(); } } }, m)));
  updatePill(); render();
}
refresh();
setInterval(() => { if (/15:04:05|05/.test(get('dock.clock.format'))) render(); }, 1000);
})();
